version: 2
updates:
  # The prefix must stay lowercase and carry no `include: "scope"` so Dependabot
  # produces "build(deps): Bump ..." - the exact form pr-validation.yml accepts
  # for a commit with no Jira ID.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    # Playwright pins an exact version because the Python package and the
    # browser build ship as a pair; a bump has to be verified against a cluster.
    ignore:
      - dependency-name: "playwright"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
